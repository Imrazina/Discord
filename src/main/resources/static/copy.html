<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Автокопирование</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #f5f5f5;
            text-align: center;
        }
        .status {
            margin: 20px 0;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 8px;
            max-width: 80%;
        }
        .progress {
            width: 100%;
            height: 5px;
            background: #e0e0e0;
            margin: 20px 0;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: #4CAF50;
            width: 0%;
            transition: width 0.5s;
        }
    </style>
</head>
<body>
<div class="status" id="status">Идет подготовка к копированию...</div>
<div class="progress">
    <div class="progress-bar" id="progressBar"></div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const params = new URLSearchParams(location.search);
        const text = decodeURIComponent(params.get('text') || '');
        const statusEl = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');

        // 1. Показываем статус
        statusEl.textContent = `Сообщение: "${text}"`;

        // 2. Плавное заполнение прогресс-бара (визуальная подготовка)
        let progress = 0;
        const interval = setInterval(() => {
            progress += 5;
            progressBar.style.width = `${progress}%`;

            if (progress >= 100) {
                clearInterval(interval);
                attemptAutoCopy(text);
            }
        }, 50);

        // 3. Попытка автоматического копирования
        async function attemptAutoCopy(text) {
            try {
                statusEl.textContent = 'Пытаемся скопировать автоматически...';

                // Создаем невидимую кнопку и "нажимаем" её программно
                const hiddenBtn = document.createElement('button');
                hiddenBtn.textContent = 'Copy';
                hiddenBtn.style.position = 'absolute';
                hiddenBtn.style.opacity = '0';
                hiddenBtn.style.pointerEvents = 'none';
                document.body.appendChild(hiddenBtn);

                hiddenBtn.addEventListener('click', async () => {
                    await navigator.clipboard.writeText(text);
                });

                hiddenBtn.click();

                statusEl.textContent = '✓ Сообщение скопировано!';
                statusEl.style.background = '#e8f5e9';

                // Закрываем через 1 секунду
                setTimeout(() => window.close(), 1000);
            } catch (err) {
                statusEl.textContent = 'Автокопирование не удалось. Закройте это окно.';
                statusEl.style.background = '#ffebee';
                console.error('Autocopy failed:', err);
            }
        }
    });
</script>
</body>
</html>
